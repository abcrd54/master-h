<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Monitor STB</title>
<style>
:root{font-family:system-ui,sans-serif;color:#e8eef7;background:#0b1220}body{margin:0;min-height:100vh;background:radial-gradient(circle at top,#19304b,#0b1220 55%)}main{max-width:620px;margin:0 auto;padding:72px 20px}.panel{background:#131d2e;border:1px solid #334866;border-radius:16px;padding:24px;box-shadow:0 20px 50px #0005}h1{margin:0;font-size:28px}p{line-height:1.5}.muted{color:#a7b5c9}form{display:flex;gap:10px;margin:24px 0}input,button{box-sizing:border-box;border:1px solid #526884;border-radius:9px;background:#1e293b;color:#fff;padding:12px}input{flex:1;min-width:0;font-size:16px}button{cursor:pointer;background:#16637e;font-weight:700}button:hover{background:#197b9c}button:disabled{opacity:.6;cursor:wait}.result{border-top:1px solid #334866;padding-top:18px;min-height:48px}.status{display:inline-block;padding:5px 10px;border-radius:999px;font-weight:700;background:#334155}.ready{background:#14532d;color:#bbf7d0}.unreachable,.offline,.unauthorized{background:#7f1d1d;color:#fecaca}.address{font-family:ui-monospace,monospace;color:#b9d8ff;margin:8px 0}.error{color:#fecaca;white-space:pre-wrap}.remote{margin-top:16px;background:#176241}.remote-shell{position:fixed;z-index:10;inset:0;background:#000}.remote-shell[hidden]{display:none}.remote-shell button{position:absolute;z-index:1;top:14px;right:14px;background:#1e293bdd}.remote-frame{width:100%;height:100%;border:0;background:#000}@media(max-width:480px){main{padding-top:36px}form{flex-direction:column}}
</style>
</head>
<body>
<main><section class="panel">
  <h1>Monitor STB</h1>
  <p class="muted">Masukkan IP STB untuk memeriksa koneksi jaringan dan status ADB. Port ADB <code>5555</code> dipakai otomatis bila tidak ditulis.</p>
  <form id="checkForm"><input id="address" inputmode="decimal" autocomplete="off" placeholder="Contoh: 192.168.50.10" aria-label="IP STB" required><button id="checkButton">Periksa</button></form>
  <div id="result" class="result muted">Belum ada STB diperiksa.</div>
</section></main>
<div id="remoteShell" class="remote-shell" hidden><button type="button" id="closeRemote">Tutup remote</button><iframe id="remoteFrame" class="remote-frame" allow="autoplay; fullscreen"></iframe></div>
<script>
const savedAddress=localStorage.getItem('stbAddress')||'';
const addressInput=document.getElementById('address');
const result=document.getElementById('result');
const button=document.getElementById('checkButton');
addressInput.value=savedAddress;
const remoteShell=document.getElementById('remoteShell');
const remoteFrame=document.getElementById('remoteFrame');
function escapeHtml(value){const e=document.createElement('div');e.textContent=value;return e.innerHTML}
function openRemote(address){const secure=location.protocol==='https:';const port=secure?'8443':'8000';remoteFrame.src=`${location.protocol}//${location.hostname}:${port}/embed.html?device=${encodeURIComponent(address)}&codec=h264&maxSize=720&bitrate=1500000&maxFps=25&audio=false&deviceKind=tv&secure=${secure}`;remoteShell.hidden=false;document.body.style.overflow='hidden'}
document.getElementById('closeRemote').addEventListener('click',()=>{remoteFrame.src='about:blank';remoteShell.hidden=true;document.body.style.overflow=''})
document.getElementById('checkForm').addEventListener('submit',async event=>{event.preventDefault();const address=addressInput.value.trim();button.disabled=true;result.className='result muted';result.textContent='Memeriksa STB...';try{const response=await fetch('/api/check',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({address})});const data=await response.json();if(!response.ok){throw new Error(data.error||'Pemeriksaan gagal')}localStorage.setItem('stbAddress',address);result.className='result';result.innerHTML=`<span class="status ${escapeHtml(data.status)}">${escapeHtml(data.status)}</span><div class="address">${escapeHtml(data.address)}</div><div class="muted">Diperiksa: ${new Date(data.lastChecked).toLocaleString('id-ID')}</div>${data.error?`<div class="error">${escapeHtml(data.error)}</div>`:''}${data.status==='ready'?'<button class="remote" type="button" id="openRemote">Buka remote layar</button>':''}`;document.getElementById('openRemote')?.addEventListener('click',()=>openRemote(data.address))}catch(error){result.className='result error';result.textContent=error.message||'Pemeriksaan gagal'}finally{button.disabled=false}});
</script>
</body>
</html>
